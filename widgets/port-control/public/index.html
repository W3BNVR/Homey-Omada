<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="stylesheet" href="./widget.css">
  <title>Omada-poortbeheer</title>
</head>
<body>
  <main class="panel">
    <header class="device-head">
      <div class="brand-mark" aria-hidden="true">O</div>
      <div class="device-title">
        <span class="overline">OMADA · POORTBEHEER</span>
        <h1 id="info-name">Apparaat laden…</h1>
        <p id="device-subtitle">Kies een apparaat in de widgetinstellingen</p>
      </div>
      <span class="status" id="info-status"><i></i><span>—</span></span>
    </header>

    <section class="port-section">
      <label for="port">Poort selecteren</label>
      <select id="port" aria-label="Selecteer poort" disabled>
        <option value="">Poorten laden…</option>
      </select>
      <div class="port-summary">
        <span class="link-indicator" id="link-dot"></span>
        <span id="info-link">Geen poort geselecteerd</span>
        <span class="summary-separator">·</span>
        <span id="info-poe">PoE —</span>
      </div>
    </section>

    <section class="actions" aria-label="Bediening">
      <div class="section-heading"><span>Bediening</span><span class="section-hint" id="action-note">Selecteer een poort</span></div>
      <div class="button-grid" id="port-actions" hidden>
        <button class="action-button" id="port-on" type="button" disabled><span class="button-icon">↗</span>Poort aan</button>
        <button class="action-button danger" id="port-off" type="button" disabled><span class="button-icon">↘</span>Poort uit</button>
      </div>
      <div class="button-grid" id="poe-actions" hidden>
        <button class="action-button primary" id="poe-on" type="button" disabled><span class="button-icon">ϟ</span>PoE aan</button>
        <button class="action-button danger" id="poe-off" type="button" disabled><span class="button-icon">ϟ</span>PoE uit</button>
      </div>
      <div class="button-grid" id="wan-actions" hidden>
        <button class="action-button primary" id="wan-on" type="button" disabled>WAN verbinden</button>
        <button class="action-button danger" id="wan-off" type="button" disabled>WAN verbreken</button>
        <label class="ipv6-toggle"><input id="wan-ipv6" type="checkbox"> IPv6</label>
      </div>
      <div class="button-grid" id="recover-actions" hidden>
        <button class="action-button" id="poe-recover" type="button" disabled>PoE herstellen</button>
      </div>
    </section>

    <footer class="device-meta">
      <span id="info-model">—</span>
      <span id="info-ip">—</span>
      <span id="info-mac">—</span>
    </footer>
    <p class="message" id="message" role="status">Verbinding maken…</p>
  </main>

  <script src="./widget.js"></script>
  <script>
    function onHomeyReady(Homey) {
      Homey.ready({ height: 340 });
      try {
        if (typeof window.initializeOmadaWidget !== 'function') throw new Error('Widgetcode is niet geladen.');
        window.initializeOmadaWidget(Homey);
      } catch (error) {
        document.getElementById('message').textContent = error.message || 'Widget starten is mislukt.';
      }
    }
  </script>
  <script src="/homey.js" data-origin="widget"></script>
</body>
</html>
